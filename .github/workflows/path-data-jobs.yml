name: PATH data jobs

# Manual Dock/Prism data jobs. Nothing here runs on push.
#
# job=prism-diff
#   Dry-run only. Never passes --apply.
#   With artifact_name empty, it opens a temporary firewall rule on Azure SQL
#   server pimsy-prism-sql, runs npm run db:dump:prism, then diffs that file.
#   artifact_name + artifact_run_id still override that and supply
#   prism-dump.json instead. Either way it uploads prism-dump.json and
#   prism-diff-report.txt. Opens the Postgres firewall because the diff
#   reads PATH.
#
# job=daily-brief-backfill
#   Reads a snapshot folder. Default is the committed snapshots/daily-brief
#   directory (see its README — do not commit customer files). Set
#   artifact_name and artifact_run_id to download a snapshot artifact
#   instead. The artifact root must be the snapshot directory.
#   apply defaults to false. The firewall opens only when apply is true.
#
# Secrets match Deploy to Azure: AZURE_CREDENTIALS, AZURE_RESOURCE_GROUP,
# AZURE_POSTGRES_SERVER_NAME, DATABASE_URL. A fresh dump also needs
# PRISM_SQL_CONNECTION_STRING (the Prism SWA SQL_CONNECTION_STRING).
# pimsy-prism-sql is not in AZURE_RESOURCE_GROUP. Its group comes from
# `az sql server list`, then optional PRISM_SQL_RESOURCE_GROUP, then
# pimsy-implementations. The Postgres rule name is github-actions-data-jobs.
# The Prism SQL rule name is github-actions-prism-sql. Both are removed
# on the way out.

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        type: choice
        options:
          - prism-diff
          - daily-brief-backfill
      apply:
        description: Write daily facts (backfill only). prism-diff stays a dry-run.
        required: false
        type: boolean
        default: false
      artifact_name:
        description: Optional artifact with snapshots or prism-dump.json. Empty backfill uses snapshots/daily-brief. Empty prism-diff dumps Prism SQL.
        required: false
        type: string
        default: ""
      artifact_run_id:
        description: Run id that published artifact_name. Required when artifact_name is set.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: path-data-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check artifact inputs
        if: inputs.artifact_name != '' && inputs.artifact_run_id == ''
        run: |
          echo "artifact_run_id is required when artifact_name is set."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the snapshot or dump artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: incoming

      - name: Log in to Azure
        if: inputs.job == 'prism-diff' || (inputs.job == 'daily-brief-backfill' && inputs.apply)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Temporarily allow this runner through the Postgres firewall
        id: fw
        if: inputs.job == 'prism-diff' || (inputs.job == 'daily-brief-backfill' && inputs.apply)
        env:
          POSTGRES_SERVER: ${{ secrets.AZURE_POSTGRES_SERVER_NAME }}
        run: |
          RUNNER_IP="$(curl -s https://api.ipify.org)"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --server-name "$POSTGRES_SERVER" \
            --name "github-actions-data-jobs" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Temporarily allow this runner through the Prism SQL firewall
        id: prismfw
        if: inputs.job == 'prism-diff' && inputs.artifact_name == ''
        env:
          PRISM_SQL_RESOURCE_GROUP: ${{ secrets.PRISM_SQL_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s https://api.ipify.org)"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          RG="$(az sql server list --query "[?name=='pimsy-prism-sql'].resourceGroup | [0]" -o tsv || true)"
          if [ -z "$RG" ] || [ "$RG" = "null" ]; then
            echo "az sql server list did not return a resource group for pimsy-prism-sql."
            RG="${PRISM_SQL_RESOURCE_GROUP:-}"
          fi
          if [ -z "$RG" ]; then
            RG="pimsy-implementations"
          fi
          if [ -z "$RG" ]; then
            echo "Could not resolve a resource group for Azure SQL server pimsy-prism-sql. The service principal cannot see Microsoft.Sql/servers/pimsy-prism-sql. Grant it Reader on that server, or set PRISM_SQL_RESOURCE_GROUP."
            exit 1
          fi
          echo "Prism SQL resource group: $RG"
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RG" > prism-sql-rg.txt
          az sql server firewall-rule create \
            --resource-group "$RG" \
            --server pimsy-prism-sql \
            --name github-actions-prism-sql \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Dump Prism SQL
        if: inputs.job == 'prism-diff' && inputs.artifact_name == ''
        env:
          PRISM_SQL_CONNECTION_STRING: ${{ secrets.PRISM_SQL_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          if [ -z "${PRISM_SQL_CONNECTION_STRING}" ]; then
            echo "PRISM_SQL_CONNECTION_STRING is empty. Add the Prism Static Web App SQL_CONNECTION_STRING as that Actions secret."
            exit 1
          fi
          if ! node -e "require.resolve('mssql')" >/dev/null 2>&1; then
            npm install mssql --no-save
          fi
          npm run db:dump:prism -- --out prism-dump.json

      - name: Prism diff (dry-run)
        if: inputs.job == 'prism-diff'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            echo "apply=true is ignored for prism-diff. This job never passes --apply."
          fi
          if [ -n "${{ inputs.artifact_name }}" ]; then
            DUMP="$(find incoming -name prism-dump.json -print -quit || true)"
            if [ -z "$DUMP" ]; then
              echo "Artifact has no prism-dump.json."
              exit 1
            fi
            if [ "$DUMP" != "prism-dump.json" ]; then
              cp "$DUMP" prism-dump.json
            fi
          elif [ ! -f prism-dump.json ]; then
            echo "prism-dump.json was not written. The dump step should have created it."
            exit 1
          fi
          npm run db:import:prism-diff -- prism-dump.json | tee prism-diff-report.txt

      - name: Upload the Prism dump
        if: always() && inputs.job == 'prism-diff'
        uses: actions/upload-artifact@v4
        with:
          name: prism-dump
          path: prism-dump.json
          if-no-files-found: ignore

      - name: Upload the Prism diff report
        if: always() && inputs.job == 'prism-diff'
        uses: actions/upload-artifact@v4
        with:
          name: prism-diff-report
          path: prism-diff-report.txt
          if-no-files-found: ignore

      - name: Daily brief backfill
        if: inputs.job == 'daily-brief-backfill'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.artifact_name }}" ] && [ -z "${{ inputs.artifact_run_id }}" ]; then
            echo "artifact_run_id is required when artifact_name is set."
            exit 1
          fi
          if [ -n "${{ inputs.artifact_name }}" ]; then
            DIR="incoming"
          else
            DIR="snapshots/daily-brief"
          fi
          if [ "$APPLY" = "true" ]; then
            npm run db:backfill:daily-brief -- --dir "$DIR" --apply
          else
            npm run db:backfill:daily-brief -- --dir "$DIR"
          fi

      - name: Remove the temporary firewall rule
        if: always() && (inputs.job == 'prism-diff' || (inputs.job == 'daily-brief-backfill' && inputs.apply))
        env:
          POSTGRES_SERVER: ${{ secrets.AZURE_POSTGRES_SERVER_NAME }}
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --server-name "$POSTGRES_SERVER" \
            --name "github-actions-data-jobs" \
            --yes \
            --output none || true

      - name: Remove the temporary Prism SQL firewall rule
        if: always() && inputs.job == 'prism-diff' && inputs.artifact_name == ''
        env:
          PRISM_SQL_RESOURCE_GROUP: ${{ secrets.PRISM_SQL_RESOURCE_GROUP }}
        run: |
          RG="$(cat prism-sql-rg.txt 2>/dev/null || true)"
          if [ -z "$RG" ] || [ "$RG" = "null" ]; then
            RG="$(az sql server list --query "[?name=='pimsy-prism-sql'].resourceGroup | [0]" -o tsv || true)"
          fi
          if [ -z "$RG" ] || [ "$RG" = "null" ]; then
            RG="${PRISM_SQL_RESOURCE_GROUP:-}"
          fi
          if [ -z "$RG" ]; then
            RG="pimsy-implementations"
          fi
          if [ -z "$RG" ]; then
            echo "Could not resolve a resource group for Azure SQL server pimsy-prism-sql. The service principal cannot see Microsoft.Sql/servers/pimsy-prism-sql. Skipping firewall delete."
            exit 0
          fi
          echo "Removing Prism SQL firewall rule in $RG"
          az sql server firewall-rule delete \
            --resource-group "$RG" \
            --server pimsy-prism-sql \
            --name github-actions-prism-sql \
            --yes \
            --output none || true
